[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline_optimization"
dynamic = ["version"]
description = "Trunk Tools data pipeline optimization exercise"
authors = [{ email = "engineering@trunk.tools" }]
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest~=8.2.0",
    "pytest-env~=1.1.3",
    "pytest-asyncio~=0.24.0",
]

[tool.ruff]
line-length = 120
extend = "ruff_defaults.toml"
extend-exclude = []

[tool.ruff.lint]
extend-ignore = [
    "FBT001",
    "FBT002",
    # Enable for optimizations
    "TCH001",
    "TCH002",
    "G004",
    "S101",
    "INP001"
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline_optimization"]

[tool.ruff.lint.extend-per-file-ignores]
"**/__init__.py" = [
    "F401", # Unused import
    "F403", # Import * used
]
"**/__tests__/**" = [
    "S101",    # Use of assert
    "PLR2004", # Magic numbers
    "ARG002",  # Unused args, pytest fixtures
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)5s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.hatch.version]
path = "src/pipeline_optimization/__init__.py"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "src/typestubs"]
ignore = []
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.14"
pythonPlatform = "Linux"

executionEnvironments = [{ root = "src" }]
