[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline_optimization"
dynamic = ["version"]
description = "Trunk Tools data pipeline optimization exercise"
authors = [{ email = "engineering@trunk.tools" }]
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.0.0,<3",
    "psutil>=5.9.0,<6",
    "tabulate~=0.10.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6,<2",
    "pytest~=8.2.0",
    "pytest-env~=1.1.3",
    "pytest-asyncio~=0.24.0",
]

[project.scripts]
main = "pipeline_optimization.main:main_sync"
orchestrator = "pipeline_optimization.orchestrator:main_sync"
benchmark = "pipeline_optimization.cli.run_benchmark:main_sync"
compare-benchmarks = "pipeline_optimization.cli.compare_benchmarks:main_sync"

[tool.ruff]
extend = "ruff.toml"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)5s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.hatch.version]
path = "src/pipeline_optimization/__init__.py"

[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.14"
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnusedCallResult = false
