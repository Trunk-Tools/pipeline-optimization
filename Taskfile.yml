version: "3"

tasks:
  pipeline:
    desc: Run the pipeline (use -- --test-case small|medium|large|all)
    cmds:
      - uv run src/pipeline_optimization/main.py {{.CLI_ARGS}}

  orchestrator:
    desc: Run the orchestrator directly
    cmds:
      - uv run src/pipeline_optimization/orchestrator.py {{.CLI_ARGS}}

  benchmark:
    desc: Benchmark a single orchestrator implementation
    cmds:
      - uv run src/pipeline_optimization/cli/run_benchmark.py {{.CLI_ARGS}}

  compare-benchmarks:
    desc: Compare multiple orchestrator implementations
    cmds:
      - uv run src/pipeline_optimization/cli/compare_benchmarks.py {{.CLI_ARGS}}

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest {{.CLI_ARGS | default "-v src"}}
